# DevBoard (advanced) — UI + Go backend + Postgres + AI. That's the whole stack.
#
#   browser ──▶ frontend (vite preview :4173) ──/api──▶ backend (Go) ──▶ postgres
#                                              ──/api/ai──▶ ai-service ──▶ ollama
#
# Every configurable value lives in .env — Compose loads it automatically and
# fills in the ${...} placeholders below. Edit .env, not this file, to change
# credentials or ports. This way learners can see in one place exactly which
# variables get injected into the db and the backend.
#
# Bring it up:  docker compose up --build
# Then open:    http://localhost:8080   (FRONTEND_HOST_PORT)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT}:5432"

  backend:
    # build = local; image = the tag CI pushes and CD pulls (IMAGE_TAG, else latest).
    build: ./backend
    image: trainwithshubham/devboard-backend:${IMAGE_TAG:-latest}
    environment:
      PORT: "${BACKEND_PORT}"
      # Built from the Postgres vars above so the credentials live in one place.
      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"   # host:container — direct curl/debug; the UI uses the gateway

  frontend:
    build: ./frontend
    image: trainwithshubham/devboard-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
      - ai-service
    ports:
      - "${FRONTEND_HOST_PORT}:4173"   # vite preview serves on 4173 inside the container

  # --- Ollama (local LLM model server) ---
  # CPU-only, small model (llama3.2:1b, ~1.3 GB). Free and self-contained.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40            # allow several minutes for the first model pull
      start_period: 30s
    ports:
      - "11434:11434"
    # Start server, wait for it, pull the model, then keep server in foreground.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull llama3.2:1b
        wait $$pid

  # --- AI Service (Python/Flask) ---
  # Streams AI answers over SSE. Talks to Ollama for the LLM and backend for task context.
  ai-service:
    build: ./ai-service
    image: trainwithshubham/devboard-ai-service:${IMAGE_TAG:-latest}
    environment:
      MODEL_API_BASE: "http://ollama:11434/v1"
      MODEL_NAME: "llama3.2:1b"
      TASK_SERVICE_URL: "http://backend:${BACKEND_PORT:-8080}"
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "3005:3005"

volumes:
  pgdata:
  ollama-models:
